<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Plans</title>
    <link rel="stylesheet" href="base.css" />
    <style>
      .c {
        height: 940px;
      }
      .head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      h1 {
        font-size: 40px;
        margin-top: 14px;
      }
      .cards {
        display: block;
        width: 1000px;
        margin: 24px auto 0;
        border-radius: 22px;
        box-shadow: 0 18px 40px -26px rgb(13 27 42 / 0.35);
        outline: 1px solid var(--line);
      }
      .note {
        text-align: center;
        font-size: 15px;
        margin-top: 10px;
      }
      .tags {
        justify-content: center;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <div class="c">
      <div class="head">
        <div>
          <span class="eyebrow t-green">Plans</span>
          <h1>Simple pricing, <span class="blue">in rupees.</span></h1>
        </div>
        <span class="by" style="margin-bottom: 10px"
          >by <img src="../codevibe-logo-dark.png" alt="Codevibe"
        /></span>
      </div>
      <img class="cards" src="shots/pricing-cards.webp" alt="" />
      <p class="note muted">
        All prices are plus 18% GST, with a GST tax invoice. With Aadhaar eSign you pay only for
        completed eSigns, from prepaid credits.
      </p>
      <div class="tags">
        <span class="tag">Free also has 2 templates and 100 API requests a month</span>
        <span class="tag">Webhooks on Cloud and self-hosted</span>
        <span class="tag">Annual Cloud: ₹9,990, saves ₹1,998</span>
      </div>
    </div>
  </body>
</html>
