name: CLA

# Asks every outside contributor to sign CLA.md once, by a comment on their pull request.
# Signatures are kept in signatures/cla.json on the `cla-signatures` branch, which must stay
# unprotected so this workflow can write to it. Organisations that sent a signed
# CLA-CORPORATE.md have their people added to `allowlist` below.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor licence agreement
    runs-on: ubuntu-latest
    # pull_request_target runs with the base repository's token. This job never checks out or
    # runs code from the pull request.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/codevibe-technology/codevibe-sign/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: codevibeShubham,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thank you for the pull request. Before we can merge it, please read the
            [contributor licence agreement](https://github.com/codevibe-technology/codevibe-sign/blob/main/CLA.md)
            and sign it by posting the comment below. If you contribute for your employer, see the
            [corporate agreement](https://github.com/codevibe-technology/codevibe-sign/blob/main/CLA-CORPORATE.md)
            instead.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: Everyone who contributed to this pull request has signed the CLA.
