<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500&amp;family=Space+Grotesk:wght@600;700&amp;display=block');
    .h { font-family: 'Space Grotesk', sans-serif; font-weight: 700; fill: #ffffff; }
    .b { font-family: 'Inter', sans-serif; font-weight: 500; fill: #c4d0de; }
    .t { font-family: 'Space Grotesk', sans-serif; font-weight: 600; }
  </style>
  <rect width="1200" height="630" fill="#0D1B2A"/>
  <circle cx="1040" cy="120" r="320" fill="#2DD4BF" opacity="0.08"/>
  <g transform="translate(80 78) scale(0.125)">
    <path d="M58 130V478H382" fill="none" stroke="#1B6AE0" stroke-width="48"/>
    <path d="M128 372C164 300 196 236 222 262C246 286 202 352 240 352C272 352 286 292 314 298C334 302 330 340 356 340" fill="none" stroke="#2DD4BF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M255 34H466V245" fill="none" stroke="#1B6AE0" stroke-width="48"/>
