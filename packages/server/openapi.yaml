  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION
        - UNAUTHORIZED
        - TOKEN_INVALID
        - OTP_INVALID
        - OTP_EXPIRED
        - FIELD_NOT_YOURS
        - FORBIDDEN
        - ENVELOPE_NOT_FOUND
        - RECIPIENT_NOT_FOUND
        - NOT_FOUND
        - INVALID_STATE
        - NOT_YOUR_TURN
        - CONFLICT
        - ESIGN_UNAVAILABLE
        - ENVELOPE_EXPIRED
        - DOCUMENT_TOO_LARGE
        - REQUIRED_FIELDS_MISSING
        - INVALID_FIELD_VALUE
        - DOCUMENT_INVALID
        - PDF_ALREADY_SIGNED
        - OTP_LOCKED
        - RATE_LIMITED
        - SEAL_FAILED
        - INTERNAL
        - PROVIDER_ERROR
        - WEBHOOK_INVALID
      x-status:
        VALIDATION: 400
        UNAUTHORIZED: 401
        TOKEN_INVALID: 401
        OTP_INVALID: 401
        OTP_EXPIRED: 401
        FIELD_NOT_YOURS: 403
        FORBIDDEN: 403
        ENVELOPE_NOT_FOUND: 404
        RECIPIENT_NOT_FOUND: 404
        NOT_FOUND: 404
        INVALID_STATE: 409
        NOT_YOUR_TURN: 409
        CONFLICT: 409
        ESIGN_UNAVAILABLE: 409
        ENVELOPE_EXPIRED: 410
        DOCUMENT_TOO_LARGE: 413
        REQUIRED_FIELDS_MISSING: 422
        INVALID_FIELD_VALUE: 422
        DOCUMENT_INVALID: 422
        PDF_ALREADY_SIGNED: 422
        OTP_LOCKED: 423
        RATE_LIMITED: 429
        SEAL_FAILED: 500
        INTERNAL: 500
        PROVIDER_ERROR: 502
        WEBHOOK_INVALID: 502
      x-descriptions:
        VALIDATION: The request is malformed. `details.issues` lists each problem as `{ path, message }`.
        UNAUTHORIZED: The API key is missing or not valid.
        TOKEN_INVALID: The signing link is unknown, already used, expired or withdrawn.
        OTP_INVALID: The one-time code is wrong (`details.attemptsLeft`), or the signing session is missing (`details.otpRequired`).
        OTP_EXPIRED: The one-time code timed out, or none was sent.
        FIELD_NOT_YOURS: A value names a field that belongs to another recipient.
        FORBIDDEN: The credential may only read; only `GET` routes are allowed.
        ENVELOPE_NOT_FOUND: No envelope with this id in the caller's workspace.
        RECIPIENT_NOT_FOUND: No recipient with this id on the envelope.
        NOT_FOUND: No route, document or template at this address.
        INVALID_STATE: Not allowed in the envelope's current status (`details.status`).
        NOT_YOUR_TURN: Sequential routing, and an earlier recipient has not acted yet.
        CONFLICT: Another request changed the envelope, or one with the same `Idempotency-Key` is still running. Try again.
        ESIGN_UNAVAILABLE: Aadhaar eSign cannot be used for this envelope right now (`details.reason`), for example because it is not set up.
        ENVELOPE_EXPIRED: The envelope is past its expiry date.
        DOCUMENT_TOO_LARGE: A PDF or the whole request is over the size limit (`details.maxBytes`).
        REQUIRED_FIELDS_MISSING: Required fields were left empty.
        INVALID_FIELD_VALUE: A value does not suit its field, for example a signature that is not a PNG or a date that does not parse.
        DOCUMENT_INVALID: A file is not a readable PDF.
        PDF_ALREADY_SIGNED: A file already carries digital signatures. Upload the unsigned original.
        OTP_LOCKED: Too many wrong guesses, or too many codes for this envelope (`details.reason`).
        RATE_LIMITED: Too many requests. Wait the number of seconds in `Retry-After`.
        SEAL_FAILED: The sealed PDF could not be produced. Safe to retry with the same `Idempotency-Key`.
        INTERNAL: An unexpected server error. Safe to retry with the same `Idempotency-Key`.
        PROVIDER_ERROR: An outside provider, such as an Aadhaar eSign service, failed or answered with something unexpected.
        WEBHOOK_INVALID: A provider's callback could not be verified.
      description: 'A stable error code. `x-status` maps each code to the HTTP status it always comes with.'
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: A sentence for people. Do not parse it; use `code` and `details`.
            details:
              type: object
              description: |
                More about the error, depending on the code: `issues` (`VALIDATION`),
                `retryAfterSeconds` (`RATE_LIMITED`), `attemptsLeft` (`OTP_*`), `status`
                (`INVALID_STATE`), `maxBytes` and `document` (document errors).
              properties:
                issues:
                  type: array
                  items:
                    type: object
                    required: [path, message]
                    properties:
                      path:
                        type: string
                        examples: ['recipients[1].email']
                      message:
                        type: string
                retryAfterSeconds:
                  type: integer
                  minimum: 1
                attemptsLeft:
                  type: integer
                  minimum: 0
    Id:
      type: string
      minLength: 1
    Timestamp:
      type: string
      format: date-time
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    EnvelopeStatus:
      type: string
      enum: [draft, sent, in_progress, completed, declined, expired, voided]
      description: '`completed`, `declined`, `expired` and `voided` are final.'
    RecipientStatus:
      type: string
      enum: [pending, notified, viewed, signed, approved, declined]
    RecipientRole:
      type: string
      enum: [signer, approver, viewer]
      description: Signers fill fields, approvers approve without fields, viewers get a copy.
    AuthMethod:
      type: string
      enum: [email_link, email_otp, sms_otp, aadhaar]
      description: How the recipient proves who they are. `email_otp`, the default, asks for the link and a code sent by email; `email_link` needs only the link.
    Routing:
      type: string
      enum: [sequential, parallel]
      description: '`sequential` goes by `order`, lowest first (equal orders sign together); `parallel` invites everyone at once.'
    FieldType:
      type: string
      enum: [signature, initials, date_signed, name, text, checkbox]
    AuditAction:
      type: string
      enum:
        - envelope.created
        - envelope.updated
        - envelope.sent
        - envelope.completed
        - envelope.declined
        - envelope.expired
        - envelope.voided
        - recipient.notified
        - recipient.reminded
        - recipient.viewed
        - recipient.authenticated
        - recipient.signed
        - recipient.approved
        - recipient.declined
        - recipient.link_shared
        - recipient.corrected
        - recipient.esign_started
        - recipient.esign_failed
        - envelope.recalled
        - envelope.revised
        - document.sealed
    Rect:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      description: A box in PDF points, measured from the top-left corner of the page.
      properties:
        x:
          type: number
          minimum: 0
        y:
          type: number
          minimum: 0
        width:
          type: number
          minimum: 1
        height:
          type: number
          minimum: 1
    Reminders:
      type: object
      additionalProperties: false
      required: [firstAfterDays, everyDays, max]
      properties:
        firstAfterDays:
          type: integer
          minimum: 0
          maximum: 365
          description: Days after the invitation for the first reminder; 0 turns reminders off.
        everyDays:
          type: integer
          minimum: 1
          maximum: 365
        max:
          type: integer
          minimum: 0
          maximum: 50
          description: Most reminders per recipient.
    Metadata:
      type: object
      maxProperties: 50
      description: Your own data, for example an employee id. Echoed in webhooks.
      propertyNames:
        maxLength: 100
      additionalProperties:
        type: string
        maxLength: 500
    Document:
      type: object
      additionalProperties: false
      required: [id, name, sha256, pageCount]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        sha256:
          $ref: '#/components/schemas/Sha256'
          description: SHA-256 of the original file.
        pageCount:
          type: integer
          minimum: 1
        pageSizes:
          type: array
          description: Size of each page in PDF points, in page order.
          items:
            type: object
            additionalProperties: false
            required: [width, height]
            properties:
              width:
                type: number
              height:
                type: number
    Recipient:
      type: object
      additionalProperties: false
      required: [id, name, role, order, auth, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
        role:
          $ref: '#/components/schemas/RecipientRole'
        order:
          type: integer
          minimum: 1
        auth:
          $ref: '#/components/schemas/AuthMethod'
        status:
          $ref: '#/components/schemas/RecipientStatus'
        declineReason:
          type: string
        actedAt:
          $ref: '#/components/schemas/Timestamp'
        notifiedAt:
          $ref: '#/components/schemas/Timestamp'
        viewedAt:
          $ref: '#/components/schemas/Timestamp'
        remindersSent:
          type: integer
          minimum: 0
        lastRemindedAt:
          $ref: '#/components/schemas/Timestamp'
        esign:
          type: object
          additionalProperties: false
          required: [provider, status]
          description: >-
            Where the recipient's Aadhaar eSign stands, once they have started one. Only for
            `auth: aadhaar`.
          properties:
            provider:
              type: string
              description: The eSign provider.
              example: leegality
            status:
              $ref: '#/components/schemas/EsignStatus'
            signerName:
              type: string
              description: The signer's name as the provider reported it.
            signedAt:
              $ref: '#/components/schemas/Timestamp'
    EsignStatus:
      type: string
      enum: [pending, signed, declined, expired, failed]
      description: >-
        `pending`: the recipient is at the provider. `expired` and `failed`: the attempt
        ended without a signature and the recipient may start again.
    EarlierSignature:
      type: object
      additionalProperties: false
      required: [valid, signerCommonName, issuerCommonName, signedAt]
      description: >-
        A digital signature made before the seal, for example an Aadhaar eSign by an eSign
        provider. Its certificate chain is not checked here.
      properties:
        valid:
          type: boolean
          description: The signature matches the bytes it covers.
        signerCommonName:
          type: [string, 'null']
          description: Who the signing certificate was issued to.
        issuerCommonName:
          type: [string, 'null']
          description: The authority that issued the signing certificate.
        signedAt:
          type: [string, 'null']
          format: date-time
    Field:
      type: object
      additionalProperties: false
      required: [id, documentId, recipientId, type, page, rect, required]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        documentId:
          $ref: '#/components/schemas/Id'
        recipientId:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/FieldType'
        page:
          type: integer
          minimum: 0
          description: Zero-based page index.
        rect:
          $ref: '#/components/schemas/Rect'
        required:
          type: boolean
        label:
          type: string
        readOnly:
          type: boolean
          description: Filled in by the sender; the recipient cannot change it.
    FieldValue:
      type: object
      additionalProperties: false
      required: [fieldId, value]
      properties:
        fieldId:
          $ref: '#/components/schemas/Id'
        value:
          type: string
          description: |
            Signature and initials: PNG as base64. Text and name: the text. Checkbox: `true` or
            `false`. Date: an ISO date.
    EnvelopeSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          title,
          status,
          createdAt,
          sentAt,
          completedAt,
          expiresAt,
          metadata,
          documents,
          recipients,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        sentAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        completedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        expiresAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        metadata:
          type: object
          additionalProperties:
            type: string
        documents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, pageCount]
            properties:
              id:
                $ref: '#/components/schemas/Id'
              name:
                type: string
              pageCount:
                type: integer
                minimum: 1
        recipients:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, email, role, status, actedAt, declineReason]
            properties:
              id:
                $ref: '#/components/schemas/Id'
              name:
                type: string
              email:
                type: [string, 'null']
              role:
                $ref: '#/components/schemas/RecipientRole'
              status:
                $ref: '#/components/schemas/RecipientStatus'
              actedAt:
                oneOf:
                  - $ref: '#/components/schemas/Timestamp'
                  - type: 'null'
              declineReason:
                type: [string, 'null']
                description: What the recipient wrote when they declined.
    EnvelopeList:
      type: object
      additionalProperties: false
      required: [envelopes, nextCursor]
      properties:
        envelopes:
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeSummary'
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page; null on the last page.
    EnvelopeCopy:
      type: object
      additionalProperties: false
      required: [draft, recalled]
      properties:
        draft:
          $ref: '#/components/schemas/Envelope'
        recalled:
          $ref: '#/components/schemas/Envelope'
    Envelope:
      type: object
      additionalProperties: false
      required:
        [id, title, status, routing, documents, recipients, fields, values, reminders, createdAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        message:
          type: string
        changeNote:
          type: string
          description: What changed since a declined version; shown to recipients.
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        routing:
          $ref: '#/components/schemas/Routing'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Field'
        values:
          type: array
          items:
            $ref: '#/components/schemas/FieldValue'
        reminders:
          $ref: '#/components/schemas/Reminders'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        sentAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          $ref: '#/components/schemas/Timestamp'
        metadata:
          $ref: '#/components/schemas/Metadata'
        auditHead:
          $ref: '#/components/schemas/Sha256'
          description: Hash of the last audit event.
    AuditEvent:
      type: object
      additionalProperties: false
      required: [seq, envelopeId, action, at, prevHash, hash]
      properties:
        seq:
          type: integer
          minimum: 1
        envelopeId:
          $ref: '#/components/schemas/Id'
        action:
          $ref: '#/components/schemas/AuditAction'
        at:
          $ref: '#/components/schemas/Timestamp'
        recipientId:
          $ref: '#/components/schemas/Id'
        context:
          type: object
          additionalProperties: false
          properties:
            ip:
              type: string
            userAgent:
              type: string
        data:
          type: object
          additionalProperties:
            type: [string, number, boolean]
        prevHash:
          $ref: '#/components/schemas/Sha256'
        hash:
          $ref: '#/components/schemas/Sha256'
    Verification:
      type: object
      additionalProperties: false
      required:
        [
          documentId,
          valid,
          reason,
          signer,
          signedAt,
          certificateSha256,
          sha256,
          seal,
          earlierSignatures,
        ]
      properties:
        documentId:
          $ref: '#/components/schemas/Id'
        valid:
          type: boolean
          description: >-
            One trusted seal, cryptographically valid, covering every byte, over any
            signatures made before it; or a file recorded as kept exactly as an eSign provider
            signed it.
        reason:
          type: [string, 'null']
          enum:
            [
              not_sealed,
              signature_invalid,
              earlier_signature_invalid,
              not_whole_document,
              multiple_signatures,
              untrusted_signer,
              null,
            ]
          description: Why the check failed; `null` when it passed.
        signer:
          type: [object, 'null']
          additionalProperties: false
          properties:
            commonName:
              type: string
            organization:
              type: string
        signedAt:
          type: [string, 'null']
          format: date-time
        certificateSha256:
          description: SHA-256 of the sealing certificate.
          oneOf:
            - $ref: '#/components/schemas/Sha256'
            - type: 'null'
        sha256:
          $ref: '#/components/schemas/Sha256'
          description: SHA-256 of the sealed file as stored.
        seal:
          type: string
          enum: [operator, provider_only]
          description: >-
            `operator`: the file ends with this server's seal. `provider_only`: an eSign
            provider locked the file against further signatures, so it is kept as the provider
            signed it and recognised by its SHA-256 in the audit trail.
        earlierSignatures:
          type: array
          description: Signatures made before the seal, earliest first. Empty for most files.
          items:
            $ref: '#/components/schemas/EarlierSignature'
    Certificate:
      type: object
      additionalProperties: false
      required:
        [envelopeId, title, status, completedAt, auditHead, chainValid, documents, recipients]
      properties:
        envelopeId:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        status:
          $ref: '#/components/schemas/EnvelopeStatus'
        completedAt:
          type: [string, 'null']
          format: date-time
        auditHead:
          oneOf:
            - $ref: '#/components/schemas/Sha256'
            - type: 'null'
        chainValid:
          type: boolean
        documents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, sha256, sealedSha256]
            properties:
              id:
                $ref: '#/components/schemas/Id'
              name:
                type: string
              sha256:
                $ref: '#/components/schemas/Sha256'
              sealedSha256:
                oneOf:
                  - $ref: '#/components/schemas/Sha256'
                  - type: 'null'
        recipients:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, email, phone, role, auth, status, actions]
            properties:
              id:
                $ref: '#/components/schemas/Id'
              name:
                type: string
              email:
                type: [string, 'null']
              phone:
                type: [string, 'null']
              role:
                $ref: '#/components/schemas/RecipientRole'
              auth:
                $ref: '#/components/schemas/AuthMethod'
              status:
                $ref: '#/components/schemas/RecipientStatus'
              actions:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [action, at, ip, userAgent]
                  properties:
                    action:
                      $ref: '#/components/schemas/AuditAction'
                    at:
                      $ref: '#/components/schemas/Timestamp'
                    ip:
                      type: [string, 'null']
                    userAgent:
                      type: [string, 'null']
    SignerActionResult:
      type: object
      additionalProperties: false
      required: [envelopeStatus, recipientStatus]
      properties:
        envelopeStatus:
          $ref: '#/components/schemas/EnvelopeStatus'
        recipientStatus:
          $ref: '#/components/schemas/RecipientStatus'
    SigningReceipt:
      type: object
      additionalProperties: false
      required: [workspaceId, envelope, recipient, waitingFor, documents]
      properties:
        workspaceId:
          type: string
          description: The workspace that sent the envelope, for its brand.
        envelope:
          type: object
          additionalProperties: false
          required: [id, title, status, completedAt]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            title:
              type: string
            status:
              $ref: '#/components/schemas/EnvelopeStatus'
            completedAt:
              type: [string, 'null']
              format: date-time
        recipient:
          type: object
          additionalProperties: false
          required: [id, name, role, status]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            name:
              type: string
            role:
              $ref: '#/components/schemas/RecipientRole'
            status:
              $ref: '#/components/schemas/RecipientStatus'
        waitingFor:
          type: integer
          minimum: 0
          description: Signers and approvers who have not acted yet.
        documents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, sealed, certificate]
            properties:
              id:
                $ref: '#/components/schemas/Id'
              name:
                type: string
              sealed:
                type: boolean
                description: The signed copy is ready to download.
              certificate:
                type: boolean
                description: >-
                  The signing certificate is a file of its own (`?file=certificate`), as for a
                  document signed with Aadhaar eSign. Otherwise it is the last page of the
                  signed copy.
    SignerView:
      type: object
      additionalProperties: false
      required:
        [
          workspaceId,
          envelope,
          recipient,
          documents,
          fields,
          values,
          otpRequired,
          authenticated,
          canAct,
          timeZone,
        ]
      properties:
        workspaceId:
          type: string
          description: The workspace that sent the envelope, for its brand.
        envelope:
          type: object
          additionalProperties: false
          required: [id, title, message, changeNote, status, expiresAt]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            title:
              type: string
            message:
              type: [string, 'null']
            changeNote:
              type: [string, 'null']
              description: What changed since a declined version, shown above the document.
            status:
              $ref: '#/components/schemas/EnvelopeStatus'
            expiresAt:
              type: [string, 'null']
              format: date-time
        recipient:
          type: object
          additionalProperties: false
          required: [id, name, email, role, status, auth]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            name:
              type: string
            email:
              type: [string, 'null']
            role:
              $ref: '#/components/schemas/RecipientRole'
            status:
              $ref: '#/components/schemas/RecipientStatus'
            auth:
              $ref: '#/components/schemas/AuthMethod'
        documents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, pageCount]
            properties:
              id:
                $ref: '#/components/schemas/Id'
              name:
                type: string
              pageCount:
                type: integer
        fields:
          type: array
          description: This recipient's fields only.
          items:
            $ref: '#/components/schemas/Field'
        values:
          type: array
          description: Values already entered in this recipient's fields.
          items:
            $ref: '#/components/schemas/FieldValue'
        otpRequired:
          type: boolean
          description: The recipient signs with a one-time code.
        authenticated:
          type: boolean
          description: A valid session came with this request.
        canAct:
          type: boolean
          description: It is this recipient's turn.
        timeZone:
          type: string
          description: >-
            IANA time zone the signing date is printed in on the document, for example
            `Asia/Kolkata`: the workspace's own, or the server's. `UTC` when none is set.
          example: Asia/Kolkata
        esign:
          type: object
          additionalProperties: false
          required: [available, provider, status]
          description: Present only for a recipient who signs with Aadhaar eSign.
          properties:
            available:
              type: boolean
              description: The sender's workspace can start an Aadhaar eSign right now.
            provider:
              type: [string, 'null']
              description: The eSign provider, once the recipient has started.
              example: leegality
            status:
              description: Where the latest attempt stands; `null` before the first.
              oneOf:
                - $ref: '#/components/schemas/EsignStatus'
                - type: 'null'
    NewDocument:
      type: object
      additionalProperties: false
      required: [name, content]
      properties:
        key:
          type: string
          maxLength: 100
          description: How fields refer to this document in the same request. Default its position, `"0"`.
        name:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          contentEncoding: base64
          contentMediaType: application/pdf
          description: The PDF file as base64.
    NewRecipient:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        `email` is required for viewers and for `email_link` and `email_otp`; `phone` for
        `sms_otp`.
      properties:
        key:
          type: string
          maxLength: 100
          description: How fields refer to this recipient in the same request. Default its position, `"0"`.
        id:
          type: string
          description: On `PATCH`, the id of an existing recipient to keep.
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
          description: International format, like `+919812345678`.
        role:
          $ref: '#/components/schemas/RecipientRole'
          default: signer
        auth:
          $ref: '#/components/schemas/AuthMethod'
          default: email_otp
        order:
          type: integer
          minimum: 1
          maximum: 1000
          description: Signing order in sequential routing. Default the position in the list, from 1.
    NewField:
      type: object
      additionalProperties: false
      required: [recipient, page]
      description: |
        A box on a page for one recipient. Give its position either as `x`, `y`, `width` and
        `height` or as `rect`.
      properties:
        recipient:
          type: [string, integer]
          description: The recipient's `key` (or `id` on `PATCH`).
        document:
          type: [string, integer]
          description: The document's `key` or `id`. Optional when the envelope has one document.
        type:
          $ref: '#/components/schemas/FieldType'
          default: signature
        page:
          type: integer
          minimum: 0
          maximum: 10000
          description: Zero-based page index.
        x:
          type: number
          minimum: 0
        y:
          type: number
          minimum: 0
        width:
          type: number
          minimum: 1
        height:
          type: number
          minimum: 1
        rect:
          $ref: '#/components/schemas/Rect'
        required:
          type: boolean
          default: true
        label:
          type: string
          maxLength: 200
      anyOf:
        - required: [rect]
        - required: [x, y, width, height]
    EnvelopeSettings:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 5000
          description: Shown to recipients in the invitation and on the signing page.
        changeNote:
          type: string
          maxLength: 2000
          description: |
            For a revised envelope: what changed, shown to recipients as "What changed: …" in
            the invitation and on the signing page. Send null or an empty string to clear it.
        routing:
          $ref: '#/components/schemas/Routing'
          default: sequential
        reminders:
          $ref: '#/components/schemas/Reminders'
        expiresAt:
          type: string
          format: date-time
          description: When the envelope expires; must be in the future.
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
          description: Used when `expiresAt` is not set.
        metadata:
          $ref: '#/components/schemas/Metadata'
    CreateEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeSettings'
      type: object
      required: [title, documents, recipients]
      unevaluatedProperties: false
      properties:
        send:
          type: boolean
          default: false
          description: Send at once instead of keeping a draft.
        documents:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/NewDocument'
        recipients:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/NewRecipient'
        fields:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/NewField'
    CreateEnvelopeUpload:
      type: object
      required: [envelope, documents]
      properties:
        envelope:
          type: string
          contentMediaType: application/json
          description: |
            The same JSON as the JSON body, with `documents` holding only `{ key, name }` for
            each file in upload order, or left out.
          examples:
            - '{"title":"Offer letter","send":true,"recipients":[{"key":"asha","name":"Asha Rao","email":"asha@example.com"}],"fields":[{"recipient":"asha","page":0,"x":72,"y":640,"width":180,"height":48}]}'
        documents:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: binary
            contentMediaType: application/pdf
    UpdateEnvelope:
      allOf:
        - $ref: '#/components/schemas/EnvelopeSettings'
      type: object
      unevaluatedProperties: false
      properties:
        message:
          type: [string, 'null']
          maxLength: 5000
        recipients:
          type: array
          minItems: 1
          maxItems: 50
          description: Replaces the recipients. Include `id` to keep an existing one.
          items:
            $ref: '#/components/schemas/NewRecipient'
        fields:
          type: array
          maxItems: 500
          description: Replaces all fields.
          items:
            $ref: '#/components/schemas/NewField'
    TemplateRole:
      type: object
      additionalProperties: false
      required: [id, name, type, auth]
      description: A slot a person fills when an envelope is made, such as Employee or HR.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          description: Unique within the template, ignoring case.
        type:
          $ref: '#/components/schemas/RecipientRole'
        auth:
          $ref: '#/components/schemas/AuthMethod'
    TemplateDocument:
      type: object
      additionalProperties: false
      required: [id, name, size, sha256, pageCount, pages]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        size:
          type: integer
          description: Size of the PDF in bytes.
        sha256:
          $ref: '#/components/schemas/Sha256'
        pageCount:
          type: integer
          minimum: 1
        pages:
          type: array
          description: Page sizes in PDF points, in page order.
          items:
            type: object
            additionalProperties: false
            required: [width, height]
            properties:
              width:
                type: number
              height:
                type: number
    TemplateField:
      type: object
      additionalProperties: false
      required: [id, documentId, roleId, type, page, rect, required]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        documentId:
          $ref: '#/components/schemas/Id'
        roleId:
          $ref: '#/components/schemas/Id'
          description: The role whose person fills the field in.
        type:
          $ref: '#/components/schemas/FieldType'
        page:
          type: integer
          minimum: 0
          description: Zero-based page index.
        rect:
          $ref: '#/components/schemas/Rect'
        required:
          type: boolean
        label:
          type: string
          description: Text fields are prefilled by label.
    Template:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - title
        - routing
        - reminders
        - expiresInDays
        - roles
        - documents
        - fields
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        description:
          type: string
        title:
          type: string
          description: Title of the envelopes made from the template.
        message:
          type: string
          description: Shown to recipients in the invitation and on the signing page.
        routing:
          $ref: '#/components/schemas/Routing'
        reminders:
          $ref: '#/components/schemas/Reminders'
        expiresInDays:
          type: integer
          description: Envelopes expire this many days after they are created.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/TemplateRole'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/TemplateDocument'
        fields:
          type: array
          items:
            $ref: '#/components/schemas/TemplateField'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    TemplateSummary:
      type: object
      additionalProperties: false
      required: [id, name, description, roles, documentCount, pageCount, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        description:
          type: [string, 'null']
        roles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, type]
            properties:
              name:
                type: string
              type:
                $ref: '#/components/schemas/RecipientRole'
        documentCount:
          type: integer
        pageCount:
          type: integer
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    TemplateList:
      type: object
      additionalProperties: false
      required: [templates, nextCursor]
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSummary'
        nextCursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page; null on the last page.
    NewTemplateRole:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        key:
          type: string
          maxLength: 100
          description: How fields refer to this role in the same request. Default its position, `"0"`.
        id:
          type: string
          description: On `PATCH`, the id of an existing role to keep.
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: For example `Employee`. Unique within the template, ignoring case.
        type:
          $ref: '#/components/schemas/RecipientRole'
          default: signer
        auth:
          $ref: '#/components/schemas/AuthMethod'
          default: email_otp
    NewTemplateField:
      type: object
      additionalProperties: false
      required: [role, page]
      description: |
        A box on a page for one role. Give its position either as `x`, `y`, `width` and
        `height` or as `rect`.
      properties:
        role:
          type: [string, integer]
          description: The role's `key` (or `id` on `PATCH`). Viewers have no fields.
        document:
          type: [string, integer]
          description: The document's `key` or `id`. Optional when the template has one document.
        type:
          $ref: '#/components/schemas/FieldType'
          default: signature
        page:
          type: integer
          minimum: 0
          maximum: 10000
          description: Zero-based page index.
        x:
          type: number
          minimum: 0
        y:
          type: number
          minimum: 0
        width:
          type: number
          minimum: 1
        height:
          type: number
          minimum: 1
        rect:
          $ref: '#/components/schemas/Rect'
        required:
          type: boolean
          default: true
        label:
          type: string
          maxLength: 200
          description: Give text fields a label to prefill them by.
      anyOf:
        - required: [rect]
        - required: [x, y, width, height]
    TemplateSettings:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: What the template is called in lists.
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Title of the envelopes made from it. Default the name.
        routing:
          $ref: '#/components/schemas/Routing'
          default: sequential
        reminders:
          $ref: '#/components/schemas/Reminders'
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
    CreateTemplate:
      allOf:
        - $ref: '#/components/schemas/TemplateSettings'
      type: object
      required: [name, documents, roles]
      unevaluatedProperties: false
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 500
        message:
          type: string
          minLength: 1
          maxLength: 5000
        documents:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/NewDocument'
        roles:
          type: array
          minItems: 1
          maxItems: 50
          description: At least one must be a signer or an approver.
          items:
            $ref: '#/components/schemas/NewTemplateRole'
        fields:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/NewTemplateField'
    CreateTemplateUpload:
      type: object
      required: [template, documents]
      properties:
        template:
          type: string
          contentMediaType: application/json
          description: |
            The same JSON as the JSON body, with `documents` holding only `{ key, name }` for
            each file in upload order, or left out.
          examples:
            - '{"name":"Offer letter","roles":[{"key":"employee","name":"Employee"}],"fields":[{"role":"employee","page":0,"x":72,"y":640,"width":180,"height":48}]}'
        documents:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: binary
            contentMediaType: application/pdf
    UpdateTemplate:
      allOf:
        - $ref: '#/components/schemas/TemplateSettings'
      type: object
      unevaluatedProperties: false
      properties:
        description:
          type: [string, 'null']
          maxLength: 500
          description: Send null to clear it.
        message:
          type: [string, 'null']
          maxLength: 5000
          description: Send null to clear it.
        roles:
          type: array
          minItems: 1
          maxItems: 50
          description: Replaces the roles. Include `id` to keep an existing one.
          items:
            $ref: '#/components/schemas/NewTemplateRole'
        fields:
          type: array
          maxItems: 500
          description: Replaces all fields.
          items:
            $ref: '#/components/schemas/NewTemplateField'
    RolePerson:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        The person who takes a role. `email` is required for viewers and for `email_link` and
        `email_otp`; `phone` for `sms_otp`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
          description: International format, like `+919812345678`.
        auth:
          $ref: '#/components/schemas/AuthMethod'
          description: Replaces the role's way of signing in for this person.
    CreateEnvelopeFromTemplate:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: object
          description: One person for every role of the template, keyed by role name or role id.
          additionalProperties:
            $ref: '#/components/schemas/RolePerson'
        prefill:
          type: object
          maxProperties: 500
          description: |
            Values for text fields, keyed by field label (case does not matter) or field id.
            A label shared by several fields fills them all. Recipients may change the values.
          additionalProperties:
            type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Replaces the template's title for this envelope.
        message:
          type: [string, 'null']
          minLength: 1
          maxLength: 5000
          description: Replaces the template's message for this envelope; null sends none.
        reminders:
          $ref: '#/components/schemas/Reminders'
        expiresAt:
          type: string
          format: date-time
          description: When the envelope expires; must be in the future.
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 365
          description: Used when `expiresAt` is not set. Default the template's.
        metadata:
          $ref: '#/components/schemas/Metadata'
        send:
          type: boolean
          default: false
          description: Send at once instead of keeping a draft.
    SealChecks:
      type: object
      additionalProperties: false
      required: [sealed, singleSignature, intact, coversWholeDocument, trustedCertificate]
      description: |
        Each check in the order it is made. `true` passed, `false` failed, `null` was not
        reached because an earlier one failed.
      properties:
        sealed:
          type: [boolean, 'null']
          description: The file carries a seal.
        singleSignature:
          type: [boolean, 'null']
          description: It carries exactly one signature.
        intact:
          type: [boolean, 'null']
          description: The signature is intact; no byte it covers was changed.
        coversWholeDocument:
          type: [boolean, 'null']
          description: The signature covers the whole file; nothing was added after sealing.
        trustedCertificate:
          type: [boolean, 'null']
          description: The seal was made with this server's certificate, or one it trusts.
    VerifiedEnvelope:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - documentId
        - documentName
        - sentAt
        - completedAt
        - recipients
        - events
        - chain
      description: What the certificate page inside the file prints, without IP addresses.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        documentId:
          $ref: '#/components/schemas/Id'
        documentName:
          type: string
        sentAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        recipients:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, contact, role, status, auth, actedAt]
            properties:
              name:
                type: string
              contact:
                type: [string, 'null']
                description: The email or phone, masked, for example `a****@example.com`.
              role:
                $ref: '#/components/schemas/RecipientRole'
              status:
                $ref: '#/components/schemas/RecipientStatus'
              auth:
                $ref: '#/components/schemas/AuthMethod'
              actedAt:
                type: [string, 'null']
                format: date-time
              esign:
                type: object
                additionalProperties: false
                required: [provider]
                description: Present for a recipient who signed, or is to sign, with Aadhaar eSign.
                properties:
                  provider:
                    type: string
                    description: The eSign provider, for example `leegality`.
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [seq, action, at, recipient]
            properties:
              seq:
                type: integer
                minimum: 1
              action:
                $ref: '#/components/schemas/AuditAction'
              at:
                $ref: '#/components/schemas/Timestamp'
              recipient:
                type: [string, 'null']
                description: Name of the recipient the event is about.
        chain:
          type: object
          additionalProperties: false
          required: [valid, head, events]
          properties:
            valid:
              type: boolean
              description: The audit hash chain is intact.
            head:
              type: [string, 'null']
              description: The last hash of the chain, as printed on the certificate page.
            events:
              type: integer
    PublicVerification:
      type: object
      additionalProperties: false
      required:
        [
          valid,
          reason,
          sha256,
          checks,
          signer,
          signedAt,
          certificateSha256,
          seal,
          earlierSignatures,
          envelope,
        ]
      properties:
        valid:
          type: boolean
          description: The file is exactly what this server sealed, unchanged since.
        reason:
          type: [string, 'null']
          enum:
            [
              not_sealed,
              multiple_signatures,
              signature_invalid,
              earlier_signature_invalid,
              not_whole_document,
              untrusted_signer,
              unreadable,
              unknown_document,
              null,
            ]
          description: |
            The first check that failed; `null` when valid. `unreadable`: the file could not
            be read as a PDF. `unknown_document`: no sealed document has this SHA-256. More
            values may be added.
        sha256:
          $ref: '#/components/schemas/Sha256'
          description: SHA-256 of the file that was checked.
        checks:
          $ref: '#/components/schemas/SealChecks'
        signer:
          type: [object, 'null']
          additionalProperties: false
          required: [commonName, organization]
          description: Who the seal's certificate was issued to.
          properties:
            commonName:
              type: [string, 'null']
            organization:
              type: [string, 'null']
        signedAt:
          type: [string, 'null']
          format: date-time
          description: When the file was sealed, from the signature.
        certificateSha256:
          description: SHA-256 of the certificate the seal was made with.
          oneOf:
            - $ref: '#/components/schemas/Sha256'
            - type: 'null'
        seal:
          type: string
          enum: [operator, provider_only]
          description: >-
            `operator`: the file ends with this server's seal. `provider_only`: an eSign
            provider locked the file against further signatures, so it is kept as the provider
            signed it and recognised by its SHA-256 in the audit trail.
        earlierSignatures:
          type: array
          description: Signatures made before the seal, earliest first. Empty for most files.
          items:
            $ref: '#/components/schemas/EarlierSignature'
        envelope:
          description: The envelope of a valid file; `null` otherwise, or when it is no longer held.
          oneOf:
            - $ref: '#/components/schemas/VerifiedEnvelope'
            - type: 'null'
    WebhookTestEvent:
      type: object
      additionalProperties: false
      required: [id, type, createdAt, data]
      properties:
        id:
          type: string
          description: The delivery id.
        type:
          const: webhook.test
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        data:
          type: object
          additionalProperties: false
          required: [message]
          properties:
            message:
              type: string
    WebhookEvent:
      type: object
      additionalProperties: false
      required: [id, type, createdAt, data]
      properties:
        id:
          type: string
          description: The delivery id; the same on every retry.
        type:
          $ref: '#/components/schemas/AuditAction'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        data:
          type: object
          additionalProperties: false
          required: [envelope]
          properties:
            envelope:
              type: object
              additionalProperties: false
              required: [id, title, status, metadata, completedAt, recipients]
              properties:
                id:
                  $ref: '#/components/schemas/Id'
                title:
                  type: string
                status:
                  $ref: '#/components/schemas/EnvelopeStatus'
                metadata:
                  $ref: '#/components/schemas/Metadata'
                completedAt:
                  type: [string, 'null']
                  format: date-time
                recipients:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, name, email, role, status, actedAt]
                    properties:
                      id:
                        $ref: '#/components/schemas/Id'
                      name:
                        type: string
                      email:
                        type: [string, 'null']
                      role:
                        $ref: '#/components/schemas/RecipientRole'
                      status:
                        $ref: '#/components/schemas/RecipientStatus'
                      actedAt:
                        type: [string, 'null']
                        format: date-time
